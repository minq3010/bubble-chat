name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: pnpm build:mac
          - name: Windows
            os: windows-latest
            command: pnpm build:win
          - name: Linux
            os: ubuntu-latest
            command: pnpm build:linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "if (process.env.GITHUB_REF_NAME.slice(1) !== require('./package.json').version) process.exit(1)"

      - name: Test update selection
        run: node electron/update-utils.test.cjs

      - name: Configure TOTP from GitHub Secrets
        env:
          BUBBLE_ENABLE_TOTP: ${{ secrets.BUBBLE_ENABLE_TOTP }}
          BUBBLE_TOTP_SECRET: ${{ secrets.BUBBLE_TOTP_SECRET }}
        run: |
          node -e "const fs = require('node:fs'); const value = process.env.BUBBLE_ENABLE_TOTP; if (value && value !== 'true' && value !== 'false') throw new Error('BUBBLE_ENABLE_TOTP must be true or false'); const enabled = value === 'true'; if (enabled && !process.env.BUBBLE_TOTP_SECRET) throw new Error('BUBBLE_TOTP_SECRET is required when TOTP is enabled'); fs.writeFileSync('electron/release-config.json', JSON.stringify(enabled ? { totp: true, secret: process.env.BUBBLE_TOTP_SECRET } : { totp: false }))"

      - name: Package app
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bubble-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: bubble-*
          merge-multiple: true

      - name: Verify release installers
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Target version: $VERSION"
          ls -la release/
          # Ensure only installers matching the current tag version are included
          for file in release/*; do
            if [ -f "$file" ] && [[ "$file" != *"$VERSION"* ]]; then
              echo "Removing unmatched asset: $file"
              rm -f "$file"
            fi
          done
          echo "Final release assets:"
          ls -la release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists, uploading installers with clobber..."
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            echo "Creating release $GITHUB_REF_NAME..."
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
